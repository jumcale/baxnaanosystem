version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: baxnaano-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-baxnaano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-baxnaano_db}
    # Security: Postgres port 5432 is NOT published to the host network; reachable only on internal Docker network
    expose:
      - '5432'
    volumes:
      - baxnaano_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-baxnaano} -d ${POSTGRES_DB:-baxnaano_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baxnaano-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-baxnaano}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-baxnaano_db}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://baxnaanosystem.onrender.com}
    ports:
      - '4000:4000'

volumes:
  baxnaano_pgdata:
