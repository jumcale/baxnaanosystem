services:
  - type: web
    name: baxnaano-staging
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://baxnaanosystem.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: baxnaano-db
          property: connectionString

databases:
  - name: baxnaano-db
    databaseName: baxnaano_db
    user: baxnaano
    plan: free

