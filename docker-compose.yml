version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: baxnaano-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: baxnaano
      POSTGRES_PASSWORD: baxnaano_secret_password
      POSTGRES_DB: baxnaano_db
    ports:
      - '5432:5432'
    volumes:
      - baxnaano_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U baxnaano -d baxnaano_db']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baxnaano-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://baxnaano:baxnaano_secret_password@postgres:5432/baxnaano_db?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '4000:4000'

volumes:
  baxnaano_pgdata:
